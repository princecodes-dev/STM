<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendar | Student Productivity</title>

    <link rel="stylesheet" href="css/sidebar.css">

    <link rel="stylesheet" href="css/calendar.css">

</head>

<body>

    <!-- Sidebar -->

    <aside id="sidebar" class="sidebar">

        <div class="sidebar-header">

            <div class="brand">

                <div class="brand-icon">🎓</div>

                <div>

                    <h2>Student</h2>

                    <p>Productivity</p>

                </div>

            </div>

            <button id="closeSidebar">✖</button>

        </div>

        <ul class="sidebar-menu">

            <li>

                <a href="dashboard.html">

                    <span>🏠</span>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="calendar.html" class="active">

                    <span>📅</span>

                    Calendar

                </a>

            </li>


            <li>

                <a href="profile.html">

                    <span>👤</span>

                    Profile

                </a>

            </li>

            <li>

                <a href="settings.html">

                    <span>⚙️</span>

                    Settings

                </a>

            </li>

            <li>
    <a href="notifications.html">
        <span>🔔</span>
        Notifications
    </a>
</li>

            <li>

                <a href="about.html">

                    <span>ℹ️</span>

                    About

                </a>

            </li>

            <li>

                <a href="#" id="logoutBtn">

                    <span>🚪</span>

                    Logout

                </a>

            </li>

            

        </ul>

    </aside>

    <!-- Overlay -->

    <div id="overlay" class="overlay"></div>

    <!-- Topbar -->

    <header class="topbar">

        <div class="topbar-left">

            <button id="menuBtn">☰</button>

            <h2>Calendar</h2>

        </div>

        <div class="topbar-right">

            <span id="username">Welcome</span>

            <button id="themeBtn">🌙</button>

        </div>

    </header>

    <!-- Main Content -->

    <main class="main-content">

        <!-- Header -->

        <section class="calendar-header">

            <div>

                <h1>📅 Calendar</h1>

                <p>

                    Manage your schedules and upcoming deadlines.

                </p>

            </div>

        </section>

        <!-- Calendar Card -->

        <section class="calendar-card">

            <div class="calendar-nav">

                <button id="prevMonth">◀</button>

                <h2 id="monthYear">

                    July 2026

                </h2>

                <button id="nextMonth">▶</button>

            </div>

            <!-- Week Days -->

            <div class="weekdays">

                <div>Sun</div>

                <div>Mon</div>

                <div>Tue</div>

                <div>Wed</div>

                <div>Thu</div>

                <div>Fri</div>

                <div>Sat</div>

            </div>

            <!-- Calendar Grid -->

            <div id="calendarGrid" class="calendar-grid">

                <!-- Generated by calendar.js -->

            </div>

        </section>

        
        <!-- Upcoming Deadlines -->

        <section class="deadline-card">

            <div class="card-header">

                <h2>Upcoming Deadlines</h2>

            </div>

            <div id="upcomingTasks" class="deadline-list">

                <div class="empty-state">

                    <p>🎉 No upcoming deadlines.</p>

                </div>

            </div>

        </section>

    </main>

    <div id="taskModal" class="calendar-modal">

    <div class="calendar-modal-content">

        <span id="closeTaskModal">&times;</span>

        <h2 id="modalDate"></h2>

        <div id="modalTaskList"></div>

    </div>

</div>

    <!-- JavaScript -->

    <script src="js/sidebar.js"></script>

    <script src="js/calendar.js"></script>

</body>

</html>
